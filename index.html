<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voue Telecom — Site em manutenção</title>
<meta name="description" content="O site da Voue Telecom está em manutenção e volta em breve.">
<meta name="theme-color" content="#0A1E3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1E3D;--muted:rgba(255,255,255,.72)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    color:#fff;
    background:var(--navy);
    background-image:
      radial-gradient(120% 70% at 50% -10%, rgba(30,136,229,.45), transparent 60%),
      linear-gradient(180deg, #0f2a52 0%, var(--navy) 70%);
    min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
  .logo{width:190px;height:auto;margin-bottom:44px}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:#9cc9ff;border:1px solid rgba(156,201,255,.35);border-radius:99px;
    padding:7px 14px;margin-bottom:18px;
  }
  .tag svg{width:14px;height:14px}
  h1{font-size:clamp(28px,7.5vw,38px);line-height:1.15;font-weight:800;margin-bottom:14px}
  p{font-size:16px;line-height:1.6;color:var(--muted);max-width:360px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-branca.png" alt="Voue Telecom" width="720" height="220">
  <span class="tag">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
    Site em manutenção
  </span>
  <h1>Voltamos em breve</h1>
  <p>Nosso site está passando por uma manutenção. Obrigado pela paciência!</p>
</main>
</body>
</html>
